version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repo/queries
    gen:
      go:
        package: gen
        out: internal/repo/gen
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        emit_exact_table_names: false
        emit_json_tags: false
