  <style>
    body { margin: 0; background: #0B0F17; color: #E6EAF2; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #5EEAD4; } a:hover { color: #99F6E4; }
    .mono { font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .flap { position: relative; display: inline-flex; align-items: center; justify-content: center; background: #0A0E16; border-radius: 3px; font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-weight: 600; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
    .flap::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.75); }
    .pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; white-space: nowrap; }
    @keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.2); opacity: 0; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
    .blink { animation: blink 1s steps(2, end) infinite; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee { display: flex; gap: 0; width: max-content; animation: marquee 48s linear infinite; }
    .marquee:hover { animation-play-state: paused; }
    @keyframes ringspin { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .blink, .marquee { animation: none; } }
    
  </style>
